; tinyscreen - ESP-WROOM-32 + 2.0" ST7789V 240x320 movie viewer

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM11
monitor_port = COm11

board_build.f_cpu = 240000000L
lib_deps =
    bodmer/TFT_eSPI
    bitbank2/JPEGDEC

; TFT_eSPI is configured here instead of editing its User_Setup.h
build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    ; display pin -> ESP32 GPIO (hardware VSPI pins for SCL/SDA/CS)
    -D TFT_SCLK=18
    -D TFT_MOSI=23
    -D TFT_CS=5
    -D TFT_DC=16
    -D TFT_RST=17
    -D TFT_BL=4
    -D TFT_BACKLIGHT_ON=HIGH
    ; if colors look inverted (black shows white), swap ON for OFF
    -D TFT_INVERSION_ON=1
    ; if red and blue are swapped, uncomment the next line
    -D TFT_RGB_ORDER=TFT_BGR
    ; 80 MHz; drop back to 40000000 if you see speckles or garbage
    -D SPI_FREQUENCY=80000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
